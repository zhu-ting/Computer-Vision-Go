name: Keep Render Service Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier cold start
    # (Render free instances sleep after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${RENDER_SERVICE_URL:-https://cv-review-api.onrender.com}/api/v1/health"
          echo "Pinging $URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "::warning::Health check returned HTTP $RESPONSE"
            exit 1
          fi
          echo "Health check OK"
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
